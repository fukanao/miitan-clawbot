<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miitan Clawbot</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="avatar-panel" aria-label="Miitan">
        <div class="avatar-wrap">
          <img id="face" src="/maid_faces/maid_05_tsujo_normal.png" alt="Miitan" />
        </div>
      </section>

      <section class="chat-panel" aria-label="チャット">
        <header class="chat-header">
          <div>
            <h1>Miitan Clawbot</h1>
            <p id="status">OpenClaw接続待機中</p>
          </div>
          <button id="voiceButton" type="button" title="音声入力">🎙</button>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chatForm" class="composer">
          <input
            id="messageInput"
            name="message"
            type="text"
            autocomplete="off"
            placeholder="メッセージを入力"
            required
          />
          <button type="submit">送信</button>
        </form>
      </section>
    </main>

    <script src="/static/app.js?v=20260430-02"></script>
  </body>
</html>
